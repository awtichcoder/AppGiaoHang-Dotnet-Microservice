name: CI (Backend + Android + Admin web)

on:
  pull_request:
  push:
    branches: [main, Khoa-Deptrai]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Unit tests
        run: dotnet test DeliveryApp.sln

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build both apps
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdminWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: AdminWeb/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
