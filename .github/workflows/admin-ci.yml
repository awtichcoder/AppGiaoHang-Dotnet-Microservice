name: CI (Admin web)

on:
  pull_request:
  push:
    branches: [admin]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
